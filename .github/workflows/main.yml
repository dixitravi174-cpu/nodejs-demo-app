name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karein
        uses: actions/checkout@v4

      - name: Node.js setup karein
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Packages install karein
        run: npm install

      - name: App ko test karein
        run: npm test

  build-and-push:
    needs: test-app
    runs-on: ubuntu-latest
    steps:
      - name: Code download karein
        uses: actions/checkout@v4

      - name: DockerHub par login karein
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Image banayein aur push karein
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nodejs-demo-app:latest
